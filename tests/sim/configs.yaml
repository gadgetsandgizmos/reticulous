# The build configurations `tests/run sim --config` can build and test: every
# image whose code differs by a compile-time option. `--config all` is all of
# them, in this order.
#
# An invocation is what `spangap build` is given, as a catalogue's builds.yaml
# has it: the Linux host target, the straddles a station does without, and a
# `--kconfig` per option. Both below are the stable catalogue's sim-mesh entry,
# with and without its one option.
configs:
  no-supe:
    about: LoRa without SUPE, as the stable catalogue builds it
    invocation: >-
      reticulous/reticulous --with spangap/hw-linux
      -x reticulous/rnsh -x reticulous/iface-auto -x reticulous/iface-ble
      -x reticulous/rnode-ble -x reticulous/nomad -x reticulous/maps
      -x spangap/viewer -x spangap/acme -x spangap/duckdns -x spangap/sshd
      -x spangap/upnp -x spangap/wg
      --kconfig CONFIG_LORA_NO_SUPE=y
  supe:
    about: LoRa with SUPE
    invocation: >-
      reticulous/reticulous --with spangap/hw-linux
      -x reticulous/rnsh -x reticulous/iface-auto -x reticulous/iface-ble
      -x reticulous/rnode-ble -x reticulous/nomad -x reticulous/maps
      -x spangap/viewer -x spangap/acme -x spangap/duckdns -x spangap/sshd
      -x spangap/upnp -x spangap/wg
